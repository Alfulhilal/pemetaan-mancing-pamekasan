version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pamekasan_fishing_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pamekasan_fishing_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pamekasan_fishing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
